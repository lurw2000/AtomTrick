# =====================================================================================
# rMD17 ablation: per-degree (Equiformer-style) LayerNorm instead of the shared LayerNorm.
# =====================================================================================
# Reproduces : the per-degree LayerNorm row of the paper's ablation table (seed 42).  3,730,368 parameters.
# Result     : test set, seed 42, mean over molecules: E 0.516 / F 2.564 vs shared LayerNorm (paper
#              model, seed 42) 0.457 / 2.224 (E +12.9 % / F +15.3 %; worse on E for 9/10, on F for
#              10/10 molecules).
# Hardware   : 1x L40S; 9.5 h (9.2-10.8 h) per molecule, median (range) over the 10 molecules.
# Usage: python train.py --config configs/rmd17/atomtrick.yaml --config configs/rmd17/ablations/perdegree_ln.yaml --molecule M --seed S
#        (or: bash scripts/reproduce/rmd17_ablations.sh perdegree_ln)
# Override file: only the changed keys + experiment name; everything else comes from atomtrick.yaml.

experiment: rmd17_perdegree_ln
layernorm_mode: default
